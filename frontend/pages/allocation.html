<div class="allocation-page">

    <div class="allocation-header">

        <div>

            <h1>
                Scientist Intern Allocation
            </h1>

            <p>
                Intelligent intern allocation based on specialization matching
            </p>

        </div>

        <div class="allocation-controls">

            <input
                type="text"
                id="searchScientist"
                placeholder="Search scientist..."
            >

            <button onclick="openScientistModal()">
                Add Scientist
            </button>

        </div>

    </div>

    <div
        id="allocationContainer"
        class="allocation-grid"
    >

    </div>

</div>

<div
    class="modal"
    id="scientistModal"
>

    <div class="modal-box">

        <h2>
            Add Scientist
        </h2>

        <input
            type="text"
            id="scientistName"
            placeholder="Scientist Name"
        >

        <input
            type="text"
            id="scientistSpecialization"
            placeholder="Specialization"
        >

        <input
            type="text"
            id="scientistDivision"
            placeholder="Division"
        >

        <div class="modal-actions">

            <button
                class="secondary-btn"
                onclick="closeModals()"
            >
                Cancel
            </button>

            <button
                class="primary-btn"
                onclick="addScientist()"
            >
                Create
            </button>

        </div>

    </div>

</div>
