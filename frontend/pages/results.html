<div class="results-page">

    <div class="results-header">

        <div>

            <h1>
                Candidate Results
            </h1>

            <p>
                AI-powered candidate evaluation overview
            </p>

        </div>

        <div class="results-controls">

            <button id="sortBtn">
                Sort by Score
            </button>

            <label>

                Selected Only

                <input
                    type="checkbox"
                    id="selectedOnly"
                >

            </label>

            <div>

                <label for="topKInput">
                    Top K
                </label>

                <input
                    type="number"
                    id="topKInput"
                    class="top-k-input"
                    value="3"
                    min="1"
                >

            </div>

            <select id="viewSelector">

                <option value="card">
                    Card View
                </option>

                <option value="table">
                    Table View
                </option>

            </select>

        </div>

    </div>

    <div id="candidateContainer">

    </div>

</div>
