<div class="results-page">

    <div class="results-header">

        <div>

            <h1>
                Candidate Results
            </h1>

            <p>
                AI-powered candidate evaluation overview
            </p>

        </div>

        <div class="results-controls">

            <div class="results-actions">

                <button id="sortBtn">
                    Sort by Score
                </button>

                <div class="export-wrapper">

                    <button id="exportBtn">
                        Export ▼
                    </button>

                    <div
                        id="exportDropdown"
                        class="export-dropdown"
                        style="display:none;"
                    >

                        <label>
                            <input type="checkbox" value="name" checked>
                            Name
                        </label>

                        <label>
                            <input type="checkbox" value="gpa" checked>
                            GPA
                        </label>

                        <label>
                            <input type="checkbox" value="score" checked>
                            Score
                        </label>

                        <label>
                            <input type="checkbox" value="selected" checked>
                            Status
                        </label>

                        <label>
                            <input type="checkbox" value="allotted_scientist" checked>
                            Scientist
                        </label>

                        <label>
                            <input type="checkbox" value="skills" checked>
                            Skills
                        </label>

                        <label>
                            <input type="checkbox" value="reasons" checked>
                            Reasons
                        </label>

                        <label>
                            <input type="checkbox" value="allocation_status" checked>
                            Allocation Status
                        </label>

                        <button id="downloadCsvBtn">
                            Export CSV
                        </button>

                    </div>

                </div>

            </div>
            <label>

                Selected Only

                <input
                    type="checkbox"
                    id="selectedOnly"
                >

            </label>

            <div>

                <label for="topKInput">
                    Top K
                </label>

                <input
                    type="number"
                    id="topKInput"
                    class="top-k-input"
                    value="3"
                    min="1"
                >

            </div>

            <select id="viewSelector">

                <option value="card">
                    Card View
                </option>

                <option value="table">
                    Table View
                </option>

            </select>

        </div>

    </div>

    <div id="candidateContainer">

    </div>

</div>
