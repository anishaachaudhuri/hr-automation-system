<div class="login-wrapper">

    <div class="login-card">

        <h1>
            Admin Authentication
        </h1>

        <p>
            Login to access requirement configuration
        </p>

        <input
            type="text"
            id="username"
            placeholder="Username"
        >

        <input
            type="password"
            id="password"
            placeholder="Password"
        >

        <button id="loginBtn">
            Login
        </button>

        <div id="loginError"></div>

    </div>

</div>
