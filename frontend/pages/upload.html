<div class="upload-card">

    <h1>
        Upload Candidate Resume
    </h1>

    <p class="subtext">
        Supported formats: PDF, DOC, DOCX, ZIP
    </p>

    <input
        type="file"
        id="resumeFile"
        accept=".pdf,.doc,.docx,.zip"
    >

    <button id="uploadBtn">
        Upload Resume
    </button>

    <div id="status"></div>

    <div id="uploadResult"></div>

</div>
