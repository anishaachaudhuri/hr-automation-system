<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        HR Automation System
    </title>

    <link
        rel="stylesheet"
        href="/static/css/dashboard.css"
    >

    <link
        rel="stylesheet"
        href="/static/css/analytics.css"
    >

    <link
        rel="stylesheet"
        href="/static/css/upload.css"
    >

    <link
        rel="stylesheet"
        href="/static/css/results.css"
    >

    <link
        rel="stylesheet"
        href="/static/css/requirements-dashboard.css"
    >

    <link
        rel="stylesheet"
        href="/static/css/requirements-login.css"
    >

    <link
        rel="stylesheet"
        href="/static/css/allocation.css"
    >

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

</head>

<body>

    <div class="layout">

        <aside class="sidebar">

            <div class="sidebar-header">

                <img
                    src="/static/assets/DRDO-logo.png"
                    alt="DRDO Logo"
                >

                <h1>
                    HR Automation System
                </h1>

                <p>
                    Candidate Management Platform
                </p>

            </div>

            <nav class="sidebar-nav">

                <button
                    data-page="analytics"
                    onclick="loadPage('analytics')"
                >
                    Dashboard
                </button>

                <button
                    data-page="upload"
                    onclick="loadPage('upload')"
                >
                    Upload Resume
                </button>

                <button
                    data-page="results"
                    onclick="loadPage('results')"
                >
                    Candidate Results
                </button>

                <button
                    data-page="requirements-login"
                    onclick="loadPage('requirements-login')"
                >
                    Requirements
                </button>

                <button
                    data-page="allocation"
                    onclick="loadPage('allocation')"
                >
                    Allocation
                </button>

            </nav>

        </aside>

        <main class="main-content">

            <div id="content-area">

            </div>

        </main>

    </div>
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
    <script src="/static/js/dashboard.js"></script>
    
</body>

</html>
